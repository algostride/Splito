<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Three stacks, matching --font-* in src/index.css: Inter for body
         copy, Outfit for display headings, JetBrains Mono for amounts. The
         weights asked for are the ones the type scale actually uses. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- data-mode is set before first paint by the inline script in
         src/main.jsx, so a dark-mode user never sees a white flash. -->
    <script>
      try {
        var stored = localStorage.getItem('splito-theme');
        document.documentElement.dataset.mode =
          stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.mode = 'light';
      }
    </script>
    <title>Splito - Splitwise Alternative</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
